  <script>
    /* ==========================================================================
       PLATO BOUGAS PORTFOLIO — REFACTORED WEBGL PARTICLE ENGINE
       Strict Sequential Scroll Timeline:
       State 1: Initial Load — "Plato Bougas" fully formed, subtitle dormant
       State 2: Subtitle "Analyst · Founder · Builder" forms
       State 3: Subtitle disperses back into background
       State 4: Main title morphs into "Google"
       State 5: Google subtitle forms (with extra Y-offset below 'g' descender)
       State 6: Google subtitle disperses back into background
       State 7: Main title morphs into "Goldman Sachs"
       State 8: Goldman Sachs subtitle forms
       State 8b: Goldman Sachs subtitle disperses
       State 9: Main title morphs into "University of Southern California"
       State 10: USC subtitle forms
       State 11: Dispersal to reveal contact links
       ========================================================================== */

    window.onerror = function(msg, url, line, col, err) {
      console.error('JS_ERR:', msg, 'Line:', line, err);
    };

    const ease = t => t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t;
    const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
    const lerp = (a, b, t) => a + (b - a) * t;
    function smoothstep(e0, e1, x) {
      const t = clamp((x - e0) / (e1 - e0), 0, 1);
      return t * t * (3 - 2 * t);
    }
    function shuffle(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }
    function computeStep(fontSize, minS, maxS, divisor) {
      return clamp(fontSize / divisor, minS, maxS);
    }

    const IS_MOBILE = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent) || window.innerWidth < 640;

    function getViewportSize() {
      if (window.visualViewport) return { w: window.visualViewport.width, h: window.visualViewport.height };
      return { w: window.innerWidth, h: window.innerHeight };
    }

    // ─── Native WebGL Setup (Zero External Dependencies, 100% CSP-Immune) ───
    let { w: W, h: H } = getViewportSize();
    let DPR = Math.min(window.devicePixelRatio || 1, IS_MOBILE ? 2.0 : 2.5);

    const canvas = document.getElementById('gl');
    const gl = canvas.getContext('webgl', { antialias: !IS_MOBILE, alpha: false, depth: false })
      || canvas.getContext('experimental-webgl');

    if (!gl) {
      console.error('WebGL initialization failed.');
    }

    const FRAG_SRC = `
  precision mediump float;
  varying float vAlpha;
  void main(){
    vec2 c = gl_PointCoord - vec2(0.5);
    float d = length(c);
    if (d > 0.5) discard;
    // Radicalnv signature celestial particle glow:
    // Brilliant diamond-sparkle core with soft atmospheric halo
    float s = clamp(1.0 - d * 2.0, 0.0, 1.0);
    float core = pow(s, 4.0);
    float aura = pow(s, 1.8);
    float glow = core * 0.70 + aura * 0.55;
    gl_FragColor = vec4(1.0, 1.0, 1.0, vAlpha * glow);
  }
`;

    const VERT_ATTEN_SRC = `
  attribute vec3 position;
  attribute float aSize;
  attribute float aAlpha;
  varying float vAlpha;
  uniform mat4 uProjection;
  uniform mat4 uModelView;
  uniform float uDPR;

  void main(){
    vAlpha = aAlpha;
    vec4 mvPosition = uModelView * vec4(position, 1.0);
    gl_PointSize = aSize * uDPR * (600.0 / max(1.0, -mvPosition.z));
    gl_Position = uProjection * mvPosition;
  }
`;

    function createShader(glCtx, type, source) {
      const s = glCtx.createShader(type);
      glCtx.shaderSource(s, source);
      glCtx.compileShader(s);
      if (!glCtx.getShaderParameter(s, glCtx.COMPILE_STATUS)) {
        console.error(glCtx.getShaderInfoLog(s));
        glCtx.deleteShader(s);
        return null;
      }
      return s;
    }

    const vertShader = createShader(gl, gl.VERTEX_SHADER, VERT_ATTEN_SRC);
    const fragShader = createShader(gl, gl.FRAGMENT_SHADER, FRAG_SRC);
    const program = gl.createProgram();
    gl.attachShader(program, vertShader);
    gl.attachShader(program, fragShader);
    gl.linkProgram(program);

    const aPosLoc = gl.getAttribLocation(program, 'position');
    const aSizeLoc = gl.getAttribLocation(program, 'aSize');
    const aAlphaLoc = gl.getAttribLocation(program, 'aAlpha');

    const uProjLoc = gl.getUniformLocation(program, 'uProjection');
    const uMvLoc = gl.getUniformLocation(program, 'uModelView');
    const uDPRLoc = gl.getUniformLocation(program, 'uDPR');

    function mat4Ortho(l, r, b, t, near, far) {
      const lr = 1 / (l - r);
      const bt = 1 / (b - t);
      const nf = 1 / (near - far);
      return new Float32Array([
        -2 * lr, 0, 0, 0,
        0, -2 * bt, 0, 0,
        0, 0, 2 * nf, 0,
        (l + r) * lr, (t + b) * bt, (far + near) * nf, 1
      ]);
    }

    function mat4LookAt(rotX, rotY, panX, panY, dist) {
      const cx = Math.cos(rotX), sx = Math.sin(rotX);
      const cy = Math.cos(rotY), sy = Math.sin(rotY);
      return new Float32Array([
        cy, sx * sy, -cx * sy, 0,
        0, cx, sx, 0,
        sy, -sx * cy, cx * cy, 0,
        panX, panY, -dist, 1
      ]);
    }

    function updateCanvasDimensions() {
      canvas.width = Math.round(W * DPR);
      canvas.height = Math.round(H * DPR);
      gl.viewport(0, 0, canvas.width, canvas.height);
    }
    updateCanvasDimensions();

    // ─── Mouse / Touch Repulsion ─────────────────────────────────────────
    let mouseX = 999999, mouseY = 999999;
    function setMouseFromClient(clientX, clientY) {
      mouseX = clientX - W / 2;
      mouseY = H / 2 - clientY;
    }
    window.addEventListener('mousemove', e => setMouseFromClient(e.clientX, e.clientY), { passive: true });
    window.addEventListener('mouseleave', () => { mouseX = 999999; mouseY = 999999; }, { passive: true });
    window.addEventListener('touchmove', e => {
      if (e.touches && e.touches[0]) setMouseFromClient(e.touches[0].clientX, e.touches[0].clientY);
    }, { passive: true });
    window.addEventListener('touchend', () => { mouseX = 999999; mouseY = 999999; }, { passive: true });

    const REPEL_RADIUS = IS_MOBILE ? 80 : 115;
    const REPEL_RADIUS_SQ = REPEL_RADIUS * REPEL_RADIUS;
    const REPEL_STRENGTH = IS_MOBILE ? 1.8 : 2.5;

    function repel(px, py) {
      const dx = px - mouseX, dy = py - mouseY;
      const dSq = dx * dx + dy * dy;
      if (dSq < REPEL_RADIUS_SQ && dSq > 0.01) {
        const d = Math.sqrt(dSq);
        const force = (1 - d / REPEL_RADIUS) * REPEL_STRENGTH;
        return { x: (dx / d) * force, y: (dy / d) * force };
      }
      return { x: 0, y: 0 };
    }

    // ─── Text Sampling Engine with Precision Subtitles ──────────────────
    const HEAD_CAP = IS_MOBILE ? 4500 : 6800;
    const DESC_CAP = IS_MOBILE ? 2000 : 3200;

    function sampleGlyphs(textLines, fontSize, minStep, maxStep, divisor, threshold, cap) {
      const CW = 2000, CH = 540;
      const c = document.createElement('canvas');
      c.width = CW; c.height = CH;
      const x = c.getContext('2d');
      x.fillStyle = '#fff';
      // Clean, elegant 600-weight typography: renders delicate, distinct particle points matching radicalnv
      x.font = '600 ' + fontSize + 'px -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro", "Segoe UI", Roboto, Helvetica, Arial, sans-serif';
      x.textAlign = 'center';
      x.textBaseline = 'middle';

      const lines = Array.isArray(textLines) ? textLines : [textLines];
      const lineHeight = fontSize * 1.18;
      const startY = CH / 2 - ((lines.length - 1) * lineHeight) / 2;

      lines.forEach((line, idx) => {
        x.fillText(line, CW / 2, startY + idx * lineHeight);
      });

      // Sleek sculpted 3D depth
      const depth = Math.round(fontSize * (IS_MOBILE ? 0.32 : 0.38));
      const halfDepth = depth / 2;

      // Particle sampling step: balanced so individual points of light remain visible
      const step = computeStep(fontSize, minStep, maxStep, divisor);
      const d = x.getImageData(0, 0, CW, CH).data;

      const frontPts = [];
      const wallPts = [];
      const rearPts = [];
      const corePts = [];

      const stepR = Math.max(1, Math.round(step));
      const halfStep = step * 0.5;
      let rowIndex = 0;

      for (let row = 0; row < CH; row += step, rowIndex++) {
        const r = Math.round(row);
        const hexShift = (rowIndex % 2 === 1) ? halfStep : 0;
        for (let col = 0; col < CW; col += step) {
          const c2 = Math.round(col + hexShift);
          if (c2 >= CW) continue;
          const alpha = d[(r * CW + c2) * 4 + 3];
          if (alpha > threshold) {
            const microJitter = step * 0.18;
            const microX = (Math.random() - 0.5) * microJitter;
            const microY = (Math.random() - 0.5) * microJitter;
            const baseX = c2 - CW / 2 + microX;
            const baseY = CH / 2 - r + microY;

            // Detect perimeter contour edge of stroke
            const isEdge = (
              c2 - stepR < 0 || d[(r * CW + (c2 - stepR)) * 4 + 3] <= threshold ||
              c2 + stepR >= CW || d[(r * CW + (c2 + stepR)) * 4 + 3] <= threshold ||
              r - stepR < 0 || d[((r - stepR) * CW + c2) * 4 + 3] <= threshold ||
              r + stepR >= CH || d[((r + stepR) * CW + c2) * 4 + 3] <= threshold ||
              alpha < 210
            );

            // 1. FRONT FACE: Crisp, distinct points of stardust light
            frontPts.push({
              x: baseX,
              y: baseY,
              z: halfDepth,
              isFront: true,
              baseAlpha: 0.95,
              sizeMul: 1.0
            });

            // 2. EXTRUDED SIDE WALLS: Contour particles bridging front to back
            if (isEdge) {
              wallPts.push({
                x: baseX,
                y: baseY,
                z: halfDepth * 0.35,
                isFront: false,
                baseAlpha: 0.70,
                sizeMul: 0.92
              });
              wallPts.push({
                x: baseX,
                y: baseY,
                z: -halfDepth * 0.35,
                isFront: false,
                baseAlpha: 0.60,
                sizeMul: 0.88
              });
            }

            // 3. STRUCTURAL REAR FACE: Subtle backing stardust plane
            if ((r % Math.round(step * 1.4) < step) && (c2 % Math.round(step * 1.4) < step)) {
              rearPts.push({
                x: baseX,
                y: baseY,
                z: -halfDepth,
                isFront: false,
                baseAlpha: 0.45,
                sizeMul: 0.85
              });
            }

            // 4. VOLUMETRIC CORE FILL: Light interior stardust
            if (Math.random() < 0.22) {
              corePts.push({
                x: baseX + (Math.random() - 0.5) * (step * 0.5),
                y: baseY + (Math.random() - 0.5) * (step * 0.5),
                z: (Math.random() - 0.5) * depth * 0.75,
                isFront: false,
                baseAlpha: 0.35,
                sizeMul: 0.80
              });
            }
          }
        }
      }

      // Preserve all front face points for 100% typographic completeness!
      let totalGenerated = frontPts.length + wallPts.length + rearPts.length + corePts.length;
      if (totalGenerated > cap) {
        const excess = totalGenerated - cap;
        if (corePts.length > excess) {
          corePts.length -= excess;
        } else {
          const rem = excess - corePts.length;
          corePts.length = 0;
          if (rearPts.length > rem) {
            rearPts.length -= rem;
          } else {
            const rem2 = rem - rearPts.length;
            rearPts.length = 0;
            if (wallPts.length > rem2) {
              wallPts.length -= rem2;
            }
          }
        }
      }

      // Draw order: Rear first, Core next, Walls third, Front face LAST on top!
      const pts = [...rearPts, ...corePts, ...wallPts, ...frontPts];
      return {
        points: pts,
        dotSize: IS_MOBILE ? 2.3 : 2.7,
        depth: depth
      };
    }

    // High-Precision Subtitle Sampling (clean stroke threshold matching HTML typography)
    function sampleLines(lines) {
      const CW = 1600, CH = 280;
      const c = document.createElement('canvas');
      c.width = CW; c.height = CH;
      const x = c.getContext('2d');
      x.fillStyle = '#fff'; x.textAlign = 'center'; x.textBaseline = 'middle';
      if ('letterSpacing' in x) {
        x.letterSpacing = '0.08em';
      }
      let minFont = Infinity;
      lines.forEach(l => {
        const weight = l.weight || 600;
        x.font = weight + ' ' + l.size + 'px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
        x.fillText(l.text, CW / 2, l.y);
        minFont = Math.min(minFont, l.size);
      });

      const step = computeStep(minFont, 1.6, 2.2, 15);
      const d = x.getImageData(0, 0, CW, CH).data;
      const pts = [];

      for (let row = 0; row < CH; row += step) {
        const r = Math.round(row);
        for (let col = 0; col < CW; col += step) {
          const c2 = Math.round(col);
          if (d[(r * CW + c2) * 4 + 3] > 110) {
            pts.push({
              x: c2 - CW / 2,
              y: CH / 2 - r,
              baseAlpha: 0.94,
              sizeMul: 1.0
            });
          }
        }
      }
      shuffle(pts);
      if (pts.length > DESC_CAP) pts.length = DESC_CAP;
      return { points: pts, dotSize: IS_MOBILE ? 1.8 : 2.1 };
    }

    let HEADLINE_TARGETS = [], DESC_TARGETS = [];
    let DESC_OFFSET = 70;

    function buildAllTargets() {
      const small = W < 640;
      const headShift = small ? 15 : 25;
      DESC_OFFSET = small ? 48 : 70;

      HEADLINE_TARGETS = [
        sampleGlyphs('Plato Bougas', small ? 42 : 100, 2.0, small ? 2.3 : 2.5, small ? 22 : 40, 85, HEAD_CAP),
        sampleGlyphs('Google', small ? 68 : 136, 2.0, small ? 2.3 : 2.5, small ? 22 : 40, 85, HEAD_CAP),
        sampleGlyphs('Goldman Sachs', small ? 38 : 82, 2.0, small ? 2.2 : 2.4, small ? 22 : 40, 85, HEAD_CAP),
        sampleGlyphs(small ? ['University of', 'Southern California'] : 'University of Southern California', small ? 28 : 50, 1.8, small ? 2.0 : 2.2, small ? 22 : 40, 85, HEAD_CAP),
      ];
      HEADLINE_TARGETS.forEach(t => t.points.forEach(p => { p.y += headShift; }));

      const capSize = small ? 16 : 24;
      const bodySize = small ? 12 : 16;
      const lineGap = small ? 25 : 36;
      const capY = 130 - lineGap / 2;
      const bodyY = 130 + lineGap / 2;

      DESC_TARGETS = [
        sampleLines([{ text: 'Analyst · Founder · Builder', size: capSize, y: 130, weight: 600 }]),
        sampleLines([
          { text: '2026 – Present', size: capSize, y: capY, weight: 600 },
          { text: 'Google Finance Division · AI Platforms & Devices', size: bodySize, y: bodyY, weight: 500 },
        ]),
        sampleLines([

      const totalPitch = autoPitch * (1.0 - userInfluence * 0.35);
      const totalRoll = autoRoll * (1.0 - userInfluence * 0.80);

      const cyaw = Math.cos(totalYaw), syaw = Math.sin(totalYaw);
      const cpitch = Math.cos(totalPitch), spitch = Math.sin(totalPitch);
      const croll = Math.cos(totalRoll), sroll = Math.sin(totalRoll);

      const headCenterY = IS_MOBILE ? 15 : 25;
      const CAM_DIST = 750;

      function rotateAndProjectHeadlinePoint(px, py, pz) {
        const dx = px;
        const dy = py - headCenterY;
        const dz = pz;

        // 1. Horizontal Yaw (user drag + auto-rotation sway)
        const x1 = dx * cyaw + dz * syaw;
        const z1 = -dx * syaw + dz * cyaw;

        // 2. Subtle 3D Perspective Pitch (reveals extruded sides & bevels)
        const y2 = dy * cpitch - z1 * spitch;
        const z2 = dy * spitch + z1 * cpitch;

        // 3. Gentle Roll
        const x3 = x1 * croll - y2 * sroll;
        const y3 = x1 * sroll + y2 * croll;

        // Realistic perspective projection:
        const perspScale = CAM_DIST / Math.max(200, CAM_DIST - z2);

        return {
          x: x3 * perspScale,
          y: y3 * perspScale + headCenterY,
          z: z2,
          scale: perspScale
        };
      }

      // ─── 1. SIMULATE BACKGROUND STARS ────────────────────────────────────
      const A = HEADLINE_TARGETS[state.fromIdx];
      const B = HEADLINE_TARGETS[state.toIdx];
      const aLen = A ? A.points.length : 0;
      const bLen = B ? B.points.length : 0;

      const descTgt = DESC_TARGETS[state.activeDescIdx];
      const dLen = descTgt ? descTgt.points.length : 0;
      const descEffectiveOpacity = state.descOpacity * (1 - state.disperseF);
      const overlayOpacity = smoothstep(0.70, 0.95, descEffectiveOpacity) * (1 - state.disperseF);
      const descFormingPull = smoothstep(0.02, 0.65, descEffectiveOpacity);

      for (let i = 0; i < N_STARS; i++) {
        const rp = repel(sx[i], sy[i]);
        sx[i] += svx[i] + rp.x;
        sy[i] += svy[i] + rp.y;
        sz[i] += svz[i];

        const boundX = W * 0.90;
        const boundY = H * 0.90;
        if (sx[i] > boundX) sx[i] = -boundX;
        if (sx[i] < -boundX) sx[i] = boundX;
        if (sy[i] > boundY) sy[i] = -boundY;
        if (sy[i] < -boundY) sy[i] = boundY;
        if (sz[i] > 360) sz[i] = -360;
        if (sz[i] < -360) sz[i] = 360;

        const wobX = Math.sin(time * sSpeed[i] + sSeed[i]) * 8;
        const wobY = Math.cos(time * sSpeed[i] * 0.8 + sSeed[i]) * 8;
        // Twinkle stays luminous and never completely darkens:
        const tw = 0.45 + 0.55 * (0.5 + 0.5 * Math.sin(time * 1.35 + sSeed[i]));

        let px = sx[i] + wobX;
        let py = sy[i] + wobY;
        let pz = sz[i];
        let pAlpha = sOpa[i] * tw;
        let pSize = sSize[i];

        // Recruited background particles (~3%): actively contribute to formation of titles and subtitles
        const recruitIdx = starRecruitMap[i];
        if (recruitIdx >= 0 && state.disperseF < 0.75) {
          const halfRecruits = Math.max(1, Math.floor(N_RECRUITS / 2));
          if (recruitIdx % 2 === 0) {
            // Contributes to title formation: drawn to letter contours across the active headline
            const rHalfIdx = Math.floor(recruitIdx / 2);
            const stepA = aLen > 0 ? aLen / halfRecruits : 1;
            const stepB = bLen > 0 ? bLen / halfRecruits : 1;
            const idxA = aLen > 0 ? Math.floor(rHalfIdx * stepA) % aLen : 0;
            const idxB = bLen > 0 ? Math.floor(rHalfIdx * stepB) % bLen : 0;

            const rHasA = A && aLen > 0;
            const rHasB = B && bLen > 0;
            if (rHasA || rHasB) {
              let tgtPtX = 0, tgtPtY = 0, tgtPtZ = 0;
              if (rHasA && rHasB) {
                const pA = A.points[idxA];
                const pB = B.points[idxB];
                tgtPtX = lerp(pA.x, pB.x, state.interpT);
                tgtPtY = lerp(pA.y, pB.y, state.interpT);
                tgtPtZ = lerp(pA.z || 0, pB.z || 0, state.interpT);
              } else if (rHasA) {
                tgtPtX = A.points[idxA].x;
                tgtPtY = A.points[idxA].y;
                tgtPtZ = A.points[idxA].z || 0;
              } else {
                tgtPtX = B.points[idxB].x;
                tgtPtY = B.points[idxB].y;
                tgtPtZ = B.points[idxB].z || 0;
              }
              const tgtRot = rotateAndProjectHeadlinePoint(tgtPtX, tgtPtY, tgtPtZ);
              const swirlAngle = time * 2.2 + sSeed[i];
              const swirlR = 9 + Math.sin(time * 1.6 + sSeed[i]) * 5;
              const tx = tgtRot.x + Math.cos(swirlAngle) * swirlR;
              const ty = tgtRot.y + Math.sin(swirlAngle) * swirlR;
              const tz = tgtRot.z;

              const pullStr = 0.52 * (1.0 - state.disperseF);
              px = lerp(px, tx, pullStr);
              py = lerp(py, ty, pullStr);
              pz = lerp(pz, tz, pullStr);
              pAlpha = Math.min(1.0, pAlpha * 1.45);
              pSize = Math.max(pSize, 2.2);
            }
          } else if (descTgt && dLen > 0 && descFormingPull > 0.01) {
            // Contributes to subtitle formation: drawn inward from cosmos to form active subtitle lines
            const sHalfIdx = Math.floor((recruitIdx - 1) / 2);
            const sStep = dLen > 0 ? dLen / halfRecruits : 1;
            const sIdx = Math.floor(sHalfIdx * sStep) % dLen;
            const pt = descTgt.points[sIdx];

            const pullFactor = 0.55 * descFormingPull;
            const swirlAngle = time * 1.9 + sSeed[i];
            const swirlR = (1.0 - descFormingPull) * 12 + 2;
            const tx = pt.x + Math.cos(swirlAngle) * swirlR;
            const ty = pt.y + Math.sin(swirlAngle) * swirlR;

            px = lerp(px, tx, pullFactor);
            py = lerp(py, ty, pullFactor);
            pz = lerp(pz, 0, pullFactor);
            pAlpha = Math.min(1.0, pAlpha * (1.0 + descFormingPull * 0.75));
            pSize = Math.max(pSize, 2.0);
          }
        }

        const ix = i * 3;
        posBuffer[ix] = px;
        posBuffer[ix + 1] = py;
        posBuffer[ix + 2] = pz;
        sizeBuffer[i] = pSize;
        alphaBuffer[i] = pAlpha;
      }

      // ─── 2. SIMULATE HEADLINE TEXT PARTICLES ─────────────────────────────
      for (let i = 0; i < HEAD_POOL; i++) {
        const bufIdx = headOffset + i;
        const ix = bufIdx * 3;

        const hasA = i < aLen;
        const hasB = i < bLen;

        const rp = repel(hDriftX[i], hDriftY[i]);
        hDriftX[i] += hVelX[i] + rp.x * 0.6;
        hDriftY[i] += hVelY[i] + rp.y * 0.6;
        if (hDriftX[i] > W * 0.90) hDriftX[i] = -W * 0.90;
        if (hDriftX[i] < -W * 0.90) hDriftX[i] = W * 0.90;
        if (hDriftY[i] > H * 0.90) hDriftY[i] = -H * 0.90;
        if (hDriftY[i] < -H * 0.90) hDriftY[i] = H * 0.90;

        if (state.disperseF > 0) {
          // Final title dispersal into background cosmos
          const lastTgt = HEADLINE_TARGETS[3];
          if (lastTgt && i < lastTgt.points.length) {
            const tbRaw = lastTgt.points[i];
            const tbRot = rotateAndProjectHeadlinePoint(tbRaw.x, tbRaw.y, tbRaw.z || 0);
            posBuffer[ix] = lerp(tbRot.x, hDriftX[i], state.disperseF);
            posBuffer[ix + 1] = lerp(tbRot.y, hDriftY[i], state.disperseF);
            posBuffer[ix + 2] = lerp(tbRot.z, hDriftZ[i], state.disperseF);
            alphaBuffer[bufIdx] = lerp(tbRaw.baseAlpha || 0.98, 0.32, state.disperseF) * (1.0 - state.disperseF * 0.5);
            sizeBuffer[bufIdx] = lerp(lastTgt.dotSize * (tbRaw.sizeMul || 1.0), 1.3, state.disperseF);
          } else {
            posBuffer[ix] = hDriftX[i]; posBuffer[ix + 1] = hDriftY[i]; posBuffer[ix + 2] = hDriftZ[i];
            alphaBuffer[bufIdx] = 0.25;
            sizeBuffer[bufIdx] = 1.2;
          }
        } else if (state.fromIdx === state.toIdx) {
          if (hasA) {
            const taRaw = A.points[i];
            const taRot = rotateAndProjectHeadlinePoint(taRaw.x, taRaw.y, taRaw.z || 0);

            // Initial page load formation: particles assemble from floating background space
            if (state.fromIdx === 0 && introEase < 1.0) {
              posBuffer[ix] = lerp(hDriftX[i], taRot.x, introEase);
              posBuffer[ix + 1] = lerp(hDriftY[i], taRot.y, introEase);
              posBuffer[ix + 2] = lerp(hDriftZ[i], taRot.z, introEase);
              alphaBuffer[bufIdx] = lerp(0.32, taRaw.baseAlpha || 0.95, introEase);
              sizeBuffer[bufIdx] = lerp(1.3, A.dotSize * (taRaw.sizeMul || 1.0) * taRot.scale, introEase);
            } else {
              posBuffer[ix] = taRot.x;
              posBuffer[ix + 1] = taRot.y;
              posBuffer[ix + 2] = taRot.z;

              const depthFactor = clamp(0.5 + (taRot.z / (A.depth || 30)) * 0.5, 0, 1);
              const baseAlpha = taRaw.isFront ? 0.96 : lerp((taRaw.baseAlpha || 0.55) * 0.75, taRaw.baseAlpha || 0.75, depthFactor);
              alphaBuffer[bufIdx] = baseAlpha;
              sizeBuffer[bufIdx] = A.dotSize * (taRaw.sizeMul || 1.0) * taRot.scale;
            }
          } else {
            // Inactive headline points drift visibly in background cosmos as ambient stars!
            posBuffer[ix] = hDriftX[i];
            posBuffer[ix + 1] = hDriftY[i];
            posBuffer[ix + 2] = hDriftZ[i];
            const tw = 0.35 + 0.35 * Math.sin(time * 1.4 + i * 0.3);
            alphaBuffer[bufIdx] = 0.30 * tw;
            sizeBuffer[bufIdx] = 1.3;
          }
        } else if (hasA && hasB) {
          // DIRECT REMORPH: smoothly glides directly into the next letterforms without dispersing!
          const taRaw = A.points[i], tbRaw = B.points[i];
          const mx = lerp(taRaw.x, tbRaw.x, state.interpT);
          const my = lerp(taRaw.y, tbRaw.y, state.interpT);
          const mz = lerp(taRaw.z || 0, tbRaw.z || 0, state.interpT);
          const mRot = rotateAndProjectHeadlinePoint(mx, my, mz);

          posBuffer[ix]     = mRot.x;
          posBuffer[ix + 1] = mRot.y;
          posBuffer[ix + 2] = mRot.z;

          const targetDepth = lerp(A.depth || 30, B.depth || 30, state.interpT);
          const depthFactor = clamp(0.5 + (mRot.z / targetDepth) * 0.5, 0, 1);
          const isFront = taRaw.isFront || tbRaw.isFront;
          const rawAlpha = lerp(taRaw.baseAlpha || 0.85, tbRaw.baseAlpha || 0.85, state.interpT);
          alphaBuffer[bufIdx] = isFront ? 0.96 : lerp(rawAlpha * 0.70, rawAlpha, depthFactor);
          sizeBuffer[bufIdx]  = lerp(A.dotSize * (taRaw.sizeMul || 1.0), B.dotSize * (tbRaw.sizeMul || 1.0), state.interpT) * mRot.scale;
        } else if (hasB) {
          // Extra points needed by Title B visibly stream in from background drifting positions!
          const tbRaw = B.points[i];
          const tbRot = rotateAndProjectHeadlinePoint(tbRaw.x, tbRaw.y, tbRaw.z || 0);
          posBuffer[ix]     = lerp(hDriftX[i], tbRot.x, state.interpT);
          posBuffer[ix + 1] = lerp(hDriftY[i], tbRot.y, state.interpT);
          posBuffer[ix + 2] = lerp(hDriftZ[i], tbRot.z, state.interpT);
          alphaBuffer[bufIdx] = lerp(0.30, tbRaw.baseAlpha || 0.95, state.interpT);
          sizeBuffer[bufIdx]  = lerp(1.3, B.dotSize * (tbRaw.sizeMul || 1.0) * tbRot.scale, state.interpT);
        } else if (hasA) {
          // Points not needed by Title B smoothly release back into drifting background cosmos!
          const taRaw = A.points[i];
          const taRot = rotateAndProjectHeadlinePoint(taRaw.x, taRaw.y, taRaw.z || 0);
          posBuffer[ix]     = lerp(taRot.x, hDriftX[i], state.interpT);
          posBuffer[ix + 1] = lerp(taRot.y, hDriftY[i], state.interpT);
          posBuffer[ix + 2] = lerp(taRot.z, hDriftZ[i], state.interpT);
          alphaBuffer[bufIdx] = lerp(taRaw.baseAlpha || 0.95, 0.30, state.interpT);
          sizeBuffer[bufIdx]  = lerp(A.dotSize * (taRaw.sizeMul || 1.0) * taRot.scale, 1.3, state.interpT);
        } else {
          // Inactive points remain visibly floating in cosmic background
          posBuffer[ix] = hDriftX[i];
          posBuffer[ix + 1] = hDriftY[i];
          posBuffer[ix + 2] = hDriftZ[i];
          const tw = 0.35 + 0.35 * Math.sin(time * 1.4 + i * 0.3);
          alphaBuffer[bufIdx] = 0.30 * tw;
          sizeBuffer[bufIdx] = 1.3;
        }
      }

      // ─── 3. SIMULATE SUBTITLE DESCRIPTION PARTICLES ────────────────────
      const dDot = descTgt ? descTgt.dotSize : 1.4;
      const descOffset = N_STARS + HEAD_POOL;
      const particleFade = 1.0 - overlayOpacity;

      for (let i = 0; i < DESC_POOL; i++) {
        const bufIdx = descOffset + i;
        const ix = bufIdx * 3;

        dDriftX[i] += dVelX[i];
        dDriftY[i] += dVelY[i];
        dDriftZ[i] += dVelZ[i];
        if (dDriftX[i] > W * 0.75) dDriftX[i] = -W * 0.75;
        if (dDriftX[i] < -W * 0.75) dDriftX[i] = W * 0.75;
        if (dDriftY[i] > H * 0.75) dDriftY[i] = -H * 0.75;
        if (dDriftY[i] < -H * 0.75) dDriftY[i] = H * 0.75;
        if (dDriftZ[i] > 300) dDriftZ[i] = -300;
        if (dDriftZ[i] < -300) dDriftZ[i] = 300;

        const hasPt = descTgt && i < dLen;
        if (hasPt && descEffectiveOpacity > 0.002) {
          const t = descTgt.points[i];
          const settle = smoothstep(0.04, 0.85, descEffectiveOpacity);

          posBuffer[ix]     = lerp(dDriftX[i], t.x, settle);
          posBuffer[ix + 1] = lerp(dDriftY[i], t.y, settle);
          posBuffer[ix + 2] = lerp(dDriftZ[i], 0, settle);

          const formAlpha = smoothstep(0.02, 0.40, descEffectiveOpacity) * 0.94;
          const driftTwinkle = 0.28 * (0.5 + 0.5 * Math.sin(time * 1.5 + i * 0.3));
          alphaBuffer[bufIdx] = lerp(driftTwinkle, formAlpha * particleFade, settle);
          sizeBuffer[bufIdx]  = lerp(1.3, dDot, settle);
        } else {
          // Ambient cosmic background stardust: particles float visibly in space when dormant
          posBuffer[ix]     = dDriftX[i];
          posBuffer[ix + 1] = dDriftY[i];
          posBuffer[ix + 2] = dDriftZ[i];
          const driftTwinkle = 0.25 * (0.5 + 0.5 * Math.sin(time * 1.5 + i * 0.3));
          alphaBuffer[bufIdx] = driftTwinkle;
          sizeBuffer[bufIdx]  = 1.2;
        }
      }

      for (let i = 0; i < 4; i++) {
        overlays[i].style.opacity = (i === state.activeDescIdx) ? overlayOpacity.toFixed(3) : '0';
      }

      // Contact Zone: Only revealed once USC has fully dispersed
      if (contactZone) {
        if (state.disperseF >= 0.88) {
          contactZone.classList.add('visible');
        } else {
          contactZone.classList.remove('visible');
        }
      }

      // ─── 4. CELESTIAL PHENOMENA (SHOOTING STAR & 3 AVOIDANCE ROCKETS) ──
      const nowMs = performance.now();
      const dt = Math.min((nowMs - lastFrameTime) / 1000, 0.05);
      lastFrameTime = nowMs;

      if (!shootingStar && nowMs >= nextStarTime) {
        spawnShootingStar();
        nextStarTime = nowMs + 8000 + Math.random() * 8000;
      }
      if (shootingStar) {
        shootingStar.x += shootingStar.vx * dt;
        shootingStar.y += shootingStar.vy * dt;
        shootingStar.age += dt;
        shootingStar.trail.unshift({ x: shootingStar.x, y: shootingStar.y });
        if (shootingStar.trail.length > TRAIL_LEN) shootingStar.trail.length = TRAIL_LEN;
        const dist = Math.hypot(shootingStar.x, shootingStar.y);
        if (dist > Math.max(W, H) * 1.25 || shootingStar.age > 6) shootingStar = null;
      }

      const starTrailOffset = descOffset + DESC_POOL;
      for (let i = 0; i < TRAIL_LEN; i++) {
        const bufIdx = starTrailOffset + i;
        const ix = bufIdx * 3;
        if (shootingStar && i < shootingStar.trail.length) {
          const pt = shootingStar.trail[i];
          const fade = 1 - i / TRAIL_LEN;
          posBuffer[ix] = pt.x;
          posBuffer[ix + 1] = pt.y;
          posBuffer[ix + 2] = 0;
          alphaBuffer[bufIdx] = fade * fade * 0.95;
          sizeBuffer[bufIdx] = 3.2 * fade + 0.7;
        } else {
          posBuffer[ix] = 0; posBuffer[ix + 1] = 0; posBuffer[ix + 2] = -9999;
          alphaBuffer[bufIdx] = 0;
          sizeBuffer[bufIdx] = 0;
        }
      }

      const textBoxMinX = -W * 0.42;
      const textBoxMaxX = W * 0.42;
      const textBoxMinY = -170;
      const textBoxMaxY = 115;

      const rocketsOffset = starTrailOffset + TRAIL_LEN;
      rockets.forEach((rk, rIdx) => {
        if (!rk.active && nowMs >= rk.nextSpawn) {
          rockets[rIdx] = spawnRocketInstance();
        }
        if (rk.active) {
          rk.x += rk.vx * dt;
          rk.y += rk.vy * dt;
          rk.age += dt;

          if (rk.x > textBoxMinX - 70 && rk.x < textBoxMaxX + 70) {
            if (rk.y > -20 && rk.y < textBoxMaxY + 30) {
              rk.y += 50 * dt;
            } else if (rk.y <= -20 && rk.y > textBoxMinY - 30) {
              rk.y -= 50 * dt;
            }
          }

          rk.trail.unshift({ x: rk.x, y: rk.y });
          if (rk.trail.length > ROCKET_TRAIL_LEN) rk.trail.length = ROCKET_TRAIL_LEN;
          if (Math.abs(rk.x) > W * 0.75 || rk.age > 16) {
            rk.active = false;
            rk.nextSpawn = nowMs + 8000 + Math.random() * 12000;
          }
        }

        const baseIdx = rocketsOffset + (rIdx * ROCKET_TRAIL_LEN);
        for (let i = 0; i < ROCKET_TRAIL_LEN; i++) {
          const bufIdx = baseIdx + i;
          const ix = bufIdx * 3;
          if (rk.active && i < rk.trail.length) {
            const pt = rk.trail[i];
            const fade = 1 - i / ROCKET_TRAIL_LEN;
            posBuffer[ix] = pt.x;
            posBuffer[ix + 1] = pt.y;
            posBuffer[ix + 2] = 0;
            alphaBuffer[bufIdx] = fade * fade * 0.72;
            sizeBuffer[bufIdx] = 2.0 * fade + 0.5;
          } else {
            posBuffer[ix] = 0; posBuffer[ix + 1] = 0; posBuffer[ix + 2] = -9999;
            alphaBuffer[bufIdx] = 0;
            sizeBuffer[bufIdx] = 0;
          }
        }
      });

      // ─── 5. UPLOAD TO UNIFIED HARDWARE BUFFER & SINGLE DRAW CALL ────────
      gl.clearColor(0.0, 0.0, 0.0, 1.0);
      gl.clear(gl.COLOR_BUFFER_BIT);

      gl.enable(gl.BLEND);
      gl.blendFunc(gl.SRC_ALPHA, gl.ONE);

      gl.useProgram(program);
      gl.uniformMatrix4fv(uProjLoc, false, projMatrix);
      gl.uniformMatrix4fv(uMvLoc, false, mvMatrix);
      gl.uniform1f(uDPRLoc, DPR);

      gl.bindBuffer(gl.ARRAY_BUFFER, vboPosition);
      gl.bufferData(gl.ARRAY_BUFFER, posBuffer, gl.DYNAMIC_DRAW);
      gl.enableVertexAttribArray(aPosLoc);
      gl.vertexAttribPointer(aPosLoc, 3, gl.FLOAT, false, 0, 0);

      gl.bindBuffer(gl.ARRAY_BUFFER, vboSize);
      gl.bufferData(gl.ARRAY_BUFFER, sizeBuffer, gl.DYNAMIC_DRAW);
      gl.enableVertexAttribArray(aSizeLoc);
      gl.vertexAttribPointer(aSizeLoc, 1, gl.FLOAT, false, 0, 0);

      gl.bindBuffer(gl.ARRAY_BUFFER, vboAlpha);
      gl.bufferData(gl.ARRAY_BUFFER, alphaBuffer, gl.DYNAMIC_DRAW);
      gl.enableVertexAttribArray(aAlphaLoc);
      gl.vertexAttribPointer(aAlphaLoc, 1, gl.FLOAT, false, 0, 0);

      gl.drawArrays(gl.POINTS, 0, TOTAL_PARTICLES);
      } catch (err) {
        console.error('FRAME_ERROR:', err);
      }
    }

    // ─── Viewport Resize Handling ────────────────────────────────────────
    let lastW = W, lastH = H;
    function onResize() {
      const vp = getViewportSize();
      const widthChanged = Math.abs(vp.w - lastW) > 6;
      const heightChangedSignificantly = Math.abs(vp.h - lastH) > 220;

      // On mobile / in-app browsers, address bar collapsing causes small height fluctuations:
      // Update canvas projection dimensions without destroying and re-initializing particle pools!
      if (IS_MOBILE && !widthChanged && !heightChangedSignificantly) {
        W = vp.w;
        H = vp.h;
        updateCanvasDimensions();
        return;
      }

      lastW = vp.w; lastH = vp.h;
      W = vp.w; H = vp.h;
      DPR = Math.min(window.devicePixelRatio || 1, IS_MOBILE ? 2.0 : 2.5);
      updateCanvasDimensions();
      buildAllTargets();
      initTextPools();
      initStarPool();
    }

    window.addEventListener('resize', onResize, { passive: true });
    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', onResize, { passive: true });
    }

    document.fonts.ready.then(() => {
      buildAllTargets();
      initTextPools();
      initStarPool();
      checkUrlParams();
      frame();
    });
  </script>
</body>
