<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Plato Bougas</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #050508;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow-x: hidden;
      overscroll-behavior: none;
      -webkit-tap-highlight-color: transparent;
    }

    #canvas-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
      pointer-events: none;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .scroll-space {
      position: relative;
      height: 500vh;
      width: 100%;
      pointer-events: auto;
      touch-action: pan-y;
    }

    .links-layer {
      position: fixed;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      display: flex;
      gap: 20px;
      opacity: 0;
      transition: opacity 0.4s ease;
      pointer-events: none;
    }

    .links-layer.visible {
      opacity: 1;
      pointer-events: auto;
    }

    .links-layer a {
      color: #8888aa;
      text-decoration: none;
      font-size: 14px;
      letter-spacing: 1px;
      text-transform: uppercase;
      transition: color 0.2s ease;
    }

    .links-layer a:hover {
      color: #ffffff;
    }
  </style>
</head>
<body>

  <div id="canvas-container">
    <canvas id="stage"></canvas>
  </div>

  <div class="scroll-space"></div>

  <div class="links-layer" id="social-links">
    <a href="mailto:hello@platobougas.com">Email</a>
    <a href="https://linkedin.com" target="_blank" rel="noopener">LinkedIn</a>
    <a href="https://github.com" target="_blank" rel="noopener">GitHub</a>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    // --- Canvas & Renderer Setup ---
    const canvas = document.getElementById('stage');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

    let width = window.innerWidth;
    let height = window.innerHeight;
    renderer.setSize(width, height);

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);
    camera.position.z = 500;

    // --- Layout Configurations ---
    const IS_MOBILE = width < 768;
    // Subtitles sit much closer to titles without overlapping descenders ('g', 'p')
    const DESC_OFFSET = IS_MOBILE ? 58 : 65; 
    const PARTICLE_SIZE = IS_MOBILE ? 1.8 : 2.2;

    const SECTIONS = [
      {
        title: "Plato Bougas",
        subtitle: ["Analyst • Founder • Builder"]
      },
      {
        title: "Google",
        subtitle: ["Hardware Finance & Strategy"]
      },
      {
        title: "USC",
        subtitle: IS_MOBILE ? ["University of", "Southern California"] : ["University of Southern California"]
      },
      {
        title: "hello@platobougas.com",
        subtitle: ["Let's build something together."]
      }
    ];

    // --- Text Point Sampling ---
    function sampleTextPoints(text, fontSize, isBold = false) {
      const textCanvas = document.createElement('canvas');
      const ctx = textCanvas.getContext('2d');
      const scale = 2;
      
      ctx.font = `${isBold ? '700' : '400'} ${fontSize * scale}px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif`;
      const metrics = ctx.measureText(text);
      
      textCanvas.width = Math.ceil(metrics.width) + 20;
      textCanvas.height = Math.ceil(fontSize * 1.5 * scale);
      
      ctx.font = `${isBold ? '700' : '400'} ${fontSize * scale}px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif`;
      ctx.fillStyle = '#ffffff';
      ctx.textBaseline = 'middle';
      ctx.fillText(text, 10, textCanvas.height / 2);

      const imgData = ctx.getImageData(0, 0, textCanvas.width, textCanvas.height);
      const points = [];
      const step = IS_MOBILE ? 3 : 2;

      for (let y = 0; y < textCanvas.height; y += step) {
        for (let x = 0; x < textCanvas.width; x += step) {
          const alpha = imgData.data[(y * textCanvas.width + x) * 4 + 3];
          if (alpha > 128) {
            points.push({
              x: (x - textCanvas.width / 2) / scale,
              y: -(y - textCanvas.height / 2) / scale
            });
          }
        }
      }
      return points;
    }

    // --- Particle System Setup ---
    const allParticles = [];

    SECTIONS.forEach((sec, sectionIndex) => {
      const titleFontSize = IS_MOBILE ? (sec.title.length > 15 ? 26 : 38) : 54;
      const subFontSize = IS_MOBILE ? 14 : 18;

      // Title points
      const titlePoints = sampleTextPoints(sec.title, titleFontSize, true);
      titlePoints.forEach(p => {
        allParticles.push({
          sec: sectionIndex,
          type: 'title',
          originX: p.x,
          originY: p.y + (sectionIndex * -350),
          originZ: 0,
          vx: (Math.random() - 0.5) * 2.0,
          vy: (Math.random() - 0.5) * 2.0,
          vz: (Math.random() - 0.5) * 2.0
        });
      });

      // Subtitle points
      sec.subtitle.forEach((subLine, lineIdx) => {
        const subPoints = sampleTextPoints(subLine, subFontSize, false);
        const lineYOffset = -DESC_OFFSET - (lineIdx * (subFontSize + 6));

        subPoints.forEach(p => {
          allParticles.push({
            sec: sectionIndex,
            type: 'subtitle',
            originX: p.x,
            originY: p.y + lineYOffset + (sectionIndex * -350),
            originZ: 0,
            vx: (Math.random() - 0.5) * 2.5,
            vy: (Math.random() - 0.5) * 2.5,
            vz: (Math.random() - 0.5) * 2.5
          });
        });
      });
    });

    const count = allParticles.length;
    const geometry = new THREE.BufferGeometry();
    const positions = new Float32Array(count * 3);

    allParticles.forEach((p, i) => {
      positions[i * 3] = p.originX;
      positions[i * 3 + 1] = p.originY;
      positions[i * 3 + 2] = p.originZ;
    });

    geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

    const material = new THREE.PointsMaterial({
      color: 0xffffff,
      size: PARTICLE_SIZE,
      transparent: true,
      opacity: 0.9,
      blending: THREE.AdditiveBlending
    });

    const particleSystem = new THREE.Points(geometry, material);
    scene.add(particleSystem);

    // --- Animation & Render Loop ---
    let targetScrollY = 0;
    let currentScrollY = 0;

    window.addEventListener('scroll', () => {
      const maxScroll = document.documentElement.scrollHeight - window.innerHeight;
      targetScrollY = Math.max(0, Math.min(window.scrollY, maxScroll));
    }, { passive: true });

    const socialLinks = document.getElementById('social-links');

    function animate() {
      requestAnimationFrame(animate);

      // Smooth scroll interpolation
      currentScrollY += (targetScrollY - currentScrollY) * 0.08;

      const maxScroll = document.documentElement.scrollHeight - window.innerHeight;
      const progress = Math.max(0, Math.min(1, currentScrollY / (maxScroll || 1)));

      // Move camera smoothly down the timeline
      camera.position.y = -progress * 1050;

      const posAttr = geometry.attributes.position;
      const posArr = posAttr.array;

      const currentSectionFloat = progress * (SECTIONS.length - 1);
      const activeSecIdx = Math.floor(currentSectionFloat);
      const secProgress = currentSectionFloat - activeSecIdx;

      for (let i = 0; i < count; i++) {
        const p = allParticles[i];
        const i3 = i * 3;

        let disperseFactor = 0;

        // Calculate smooth dispersion without mutating origin state
        if (p.sec < activeSecIdx) {
          disperseFactor = 120; // Fully dispersed
        } else if (p.sec === activeSecIdx) {
          if (p.type === 'subtitle') {
            // Gradual power curve for controlled, smooth subtitle dispersion
            disperseFactor = Math.pow(secProgress, 1.5) * 110;
          } else {
            // Title disperses near section end
            disperseFactor = Math.pow(Math.max(0, secProgress - 0.65) / 0.35, 2) * 120;
          }
        }

        const targetX = p.originX + (p.vx * disperseFactor);
        const targetY = p.originY + (p.vy * disperseFactor);
        const targetZ = p.originZ + (p.vz * disperseFactor);

        // Smooth transition to target position
        posArr[i3] += (targetX - posArr[i3]) * 0.12;
        posArr[i3 + 1] += (targetY - posArr[i3 + 1]) * 0.12;
        posArr[i3 + 2] += (targetZ - posArr[i3 + 2]) * 0.12;
      }

      posAttr.needsUpdate = true;

      // Show footer links at end of scroll
      if (progress > 0.9) {
        socialLinks.classList.add('visible');
      } else {
        socialLinks.classList.remove('visible');
      }

      renderer.render(scene, camera);
    }

    animate();

    // Debounced Resize Event
    let resizeTimeout;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimeout);
      resizeTimeout = setTimeout(() => {
        if (Math.abs(window.innerWidth - width) > 40) {
          width = window.innerWidth;
          height = window.innerHeight;
          camera.aspect = width / height;
          camera.updateProjectionMatrix();
          renderer.setSize(width, height);
        }
      }, 200);
    });
  </script>
</body>
</html>
