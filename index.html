<script>
/* ==========================================================================
   PLATO BOUGAS PORTFOLIO — REFACTORED WEBGL PARTICLE ENGINE
   Strict Sequential Scroll Timeline:
   State 1: Initial Load — "Plato Bougas" fully formed, subtitle dormant
   State 2: Subtitle "Analyst · Founder · Builder" forms
   State 3: Subtitle disperses back into background
   State 4: Main title morphs into "Google"
   State 5: Google subtitle forms (with extra Y-offset below 'g' descender)
   State 6: Google subtitle disperses back into background
   State 7: Main title morphs into "Goldman Sachs"
   State 8: Goldman Sachs subtitle forms
   State 8b: Goldman Sachs subtitle disperses
   State 9: Main title morphs into "University of Southern California"
   State 10: USC subtitle forms
   State 11: Dispersal to reveal contact links
   ========================================================================== */

const ease = t => t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
function smoothstep(e0, e1, x) {
  const t = clamp((x - e0) / (e1 - e0), 0, 1);
  return t * t * (3 - 2 * t);
}
function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}
function computeStep(fontSize, minS, maxS, divisor) {
  return clamp(fontSize / divisor, minS, maxS);
}

const IS_MOBILE = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent) || window.innerWidth < 640;

function getViewportSize() {
  if (window.visualViewport) return { w: window.visualViewport.width, h: window.visualViewport.height };
  return { w: window.innerWidth, h: window.innerHeight };
}

// ─── Native WebGL Setup (Zero External Dependencies, 100% CSP-Immune) ───
let { w: W, h: H } = getViewportSize();
let DPR = Math.min(window.devicePixelRatio || 1, IS_MOBILE ? 1.5 : 2.0);

const canvas = document.getElementById('gl');
const gl = canvas.getContext('webgl', { antialias: !IS_MOBILE, alpha: false, depth: false })
       || canvas.getContext('experimental-webgl');

if (!gl) {
  console.error('WebGL initialization failed.');
}

const FRAG_SRC = `
  precision mediump float;
  varying float vAlpha;
  void main(){
    vec2 c = gl_PointCoord - vec2(0.5);
    float d = length(c);
    if (d > 0.5) discard;
    float edge = smoothstep(0.5, 0.35, d);
    gl_FragColor = vec4(1.0, 1.0, 1.0, vAlpha * edge);
  }
`;

const VERT_ATTEN_SRC = `
  attribute vec3 position;
  attribute float aSize;
  attribute float aAlpha;
  varying float vAlpha;
  uniform mat4 uProjection;
  uniform mat4 uModelView;
  uniform float uDPR;

  void main(){
    vAlpha = aAlpha;
    vec4 mvPosition = uModelView * vec4(position, 1.0);
    gl_PointSize = aSize * uDPR * (600.0 / max(1.0, -mvPosition.z));
    gl_Position = uProjection * mvPosition;
  }
`;

function createShader(glCtx, type, source) {
  const s = glCtx.createShader(type);
  glCtx.shaderSource(s, source);
  glCtx.compileShader(s);
  if (!glCtx.getShaderParameter(s, glCtx.COMPILE_STATUS)) {
    console.error(glCtx.getShaderInfoLog(s));
    glCtx.deleteShader(s);
    return null;
  }
  return s;
}

const vertShader = createShader(gl, gl.VERTEX_SHADER, VERT_ATTEN_SRC);
const fragShader = createShader(gl, gl.FRAGMENT_SHADER, FRAG_SRC);
const program = gl.createProgram();
gl.attachShader(program, vertShader);
gl.attachShader(program, fragShader);
gl.linkProgram(program);

const aPosLoc = gl.getAttribLocation(program, 'position');
const aSizeLoc = gl.getAttribLocation(program, 'aSize');
const aAlphaLoc = gl.getAttribLocation(program, 'aAlpha');

const uProjLoc = gl.getUniformLocation(program, 'uProjection');
const uMvLoc = gl.getUniformLocation(program, 'uModelView');
const uDPRLoc = gl.getUniformLocation(program, 'uDPR');

function mat4Ortho(l, r, b, t, near, far) {
  const lr = 1 / (l - r);
  const bt = 1 / (b - t);
  const nf = 1 / (near - far);
  return new Float32Array([
    -2 * lr, 0, 0, 0,
    0, -2 * bt, 0, 0,
    0, 0, 2 * nf, 0,
    (l + r) * lr, (t + b) * bt, (far + near) * nf, 1
  ]);
}

function mat4LookAt(rotX, rotY, panX, panY, dist) {
  const cx = Math.cos(rotX), sx = Math.sin(rotX);
  const cy = Math.cos(rotY), sy = Math.sin(rotY);
  return new Float32Array([
    cy, sx * sy, -cx * sy, 0,
    0, cx, sx, 0,
    sy, -sx * cy, cx * cy, 0,
    panX, panY, -dist, 1
  ]);
}

function updateCanvasDimensions() {
  canvas.width = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  gl.viewport(0, 0, canvas.width, canvas.height);
}
updateCanvasDimensions();

// ─── Mouse / Touch Repulsion ─────────────────────────────────────────
let mouseX = 999999, mouseY = 999999;
function setMouseFromClient(clientX, clientY) {
  mouseX = clientX - W / 2;
  mouseY = H / 2 - clientY;
}
window.addEventListener('mousemove', e => setMouseFromClient(e.clientX, e.clientY), { passive: true });
window.addEventListener('mouseleave', () => { mouseX = 999999; mouseY = 999999; }, { passive: true });
window.addEventListener('touchmove', e => {
  if (e.touches && e.touches[0]) setMouseFromClient(e.touches[0].clientX, e.touches[0].clientY);
}, { passive: true });
window.addEventListener('touchend', () => { mouseX = 999999; mouseY = 999999; }, { passive: true });

const REPEL_RADIUS = IS_MOBILE ? 80 : 115;
const REPEL_RADIUS_SQ = REPEL_RADIUS * REPEL_RADIUS;
const REPEL_STRENGTH = IS_MOBILE ? 1.8 : 2.5;

function repel(px, py) {
  const dx = px - mouseX, dy = py - mouseY;
  const dSq = dx * dx + dy * dy;
  if (dSq < REPEL_RADIUS_SQ && dSq > 0.01) {
    const d = Math.sqrt(dSq);
    const force = (1 - d / REPEL_RADIUS) * REPEL_STRENGTH;
    return { x: (dx / d) * force, y: (dy / d) * force };
  }
  return { x: 0, y: 0 };
}

// ─── Text Sampling Engine with Precision Subtitles ──────────────────
const HEAD_CAP = IS_MOBILE ? 2200 : 3400;
const DESC_CAP = IS_MOBILE ? 2400 : 3800;

function sampleGlyphs(textLines, fontSize, minStep, maxStep, divisor, threshold, cap) {
  const CW = 1400, CH = 440;
  const c = document.createElement('canvas');
  c.width = CW; c.height = CH;
  const x = c.getContext('2d');
  x.fillStyle = '#fff';
  x.font = '700 ' + fontSize + 'px -apple-system, BlinkMacSystemFont, sans-serif';
  x.textAlign = 'center'; x.textBaseline = 'middle';

  const lines = Array.isArray(textLines) ? textLines : [textLines];
  const lineHeight = fontSize * 1.15;
  const startY = CH / 2 - ((lines.length - 1) * lineHeight) / 2;

  lines.forEach((line, idx) => {
    x.fillText(line, CW / 2, startY + idx * lineHeight);
  });

  const step = computeStep(fontSize, minStep, maxStep, divisor);
  const jitter = step * 0.25;
  const d = x.getImageData(0, 0, CW, CH).data;
  const pts = [];

  for (let row = 0; row < CH; row += step) {
    const r = Math.round(row);
    for (let col = 0; col < CW; col += step) {
      const c2 = Math.round(col);
      if (d[(r * CW + c2) * 4 + 3] > threshold) {
        pts.push({
          x: c2 - CW / 2 + (Math.random() - 0.5) * jitter,
          y: CH / 2 - r + (Math.random() - 0.5) * jitter
        });
      }
    }
  }
  shuffle(pts);
  if (pts.length > cap) pts.length = cap;
  return { points: pts, dotSize: Math.max(1.2, step * 0.65) };
}

// High-Precision Subtitle Sampling (zero jitter, clean stroke threshold)
function sampleLines(lines) {
  const CW = 1400, CH = 260;
  const c = document.createElement('canvas');
  c.width = CW; c.height = CH;
  const x = c.getContext('2d');
  x.fillStyle = '#fff'; x.textAlign = 'center'; x.textBaseline = 'middle';
  let minFont = Infinity;
  lines.forEach(l => {
    x.font = '600 ' + l.size + 'px -apple-system, BlinkMacSystemFont, sans-serif';
    x.fillText(l.text, CW / 2, l.y);
    minFont = Math.min(minFont, l.size);
  });

  const step = computeStep(minFont, 1.2, 1.8, 14);
  const d = x.getImageData(0, 0, CW, CH).data;
  const pts = [];

  for (let row = 0; row < CH; row += step) {
    const r = Math.round(row);
    for (let col = 0; col < CW; col += step) {
      const c2 = Math.round(col);
      if (d[(r * CW + c2) * 4 + 3] > 110) {
        pts.push({
          x: c2 - CW / 2,
          y: CH / 2 - r
        });
      }
    }
  }
  shuffle(pts);
  if (pts.length > DESC_CAP) pts.length = DESC_CAP;
  return { points: pts, dotSize: IS_MOBILE ? 1.3 : 1.55 };
}

let HEADLINE_TARGETS = [], DESC_TARGETS = [];
let DESC_OFFSET = 70;

function buildAllTargets() {
  const small = W < 640;
  const headShift = small ? 15 : 25;
  DESC_OFFSET = small ? 48 : 70;

  HEADLINE_TARGETS = [
    sampleGlyphs('Plato Bougas', small ? 54 : 104, 1.4, 3.2, 30, 80, HEAD_CAP),
    sampleGlyphs('Google', small ? 78 : 140, 1.4, 3.2, 30, 80, HEAD_CAP),
    sampleGlyphs('Goldman Sachs', small ? 44 : 80, 1.4, 3.2, 30, 80, HEAD_CAP),
    sampleGlyphs(small ? ['University of', 'Southern California'] : 'University of Southern California', small ? 32 : 46, 1.3, 3.2, 30, 80, HEAD_CAP),
  ];
  HEADLINE_TARGETS.forEach(t => t.points.forEach(p => { p.y += headShift; }));

  const capSize = small ? 16 : 24;
  const bodySize = small ? 12 : 16;
  const lineGap = small ? 25 : 36;
  const capY = 130 - lineGap / 2;
  const bodyY = 130 + lineGap / 2;

  DESC_TARGETS = [
    sampleLines([{ text: 'Analyst · Founder · Builder', size: capSize, y: 130 }]),
    sampleLines([
      { text: '2022 – Present', size: capSize, y: capY },
      { text: 'Google Finance Division · AI Platforms & Devices', size: bodySize, y: bodyY },
    ]),
    sampleLines([
      { text: '2021 – 2026', size: capSize, y: capY },
      { text: 'Equity Derivative Trading · Global Markets Division · Associate', size: bodySize, y: bodyY },
    ]),
    sampleLines([
      { text: '2018 – 2021', size: capSize, y: capY },
      { text: 'Finance · Product Design', size: bodySize, y: bodyY },
    ]),
  ];

  // ADJUSTMENT 2: Dedicated Y-axis offset for Google subtitle below lowercase 'g' descender
  const googleExtraOffset = small ? 22 : 32;

  DESC_TARGETS.forEach((t, i) => {
    const offset = (i === 1) ? (DESC_OFFSET + googleExtraOffset) : DESC_OFFSET;
    t.points.forEach(p => { p.y -= offset; });
  });

  document.querySelectorAll('.desc-overlay').forEach((el, i) => {
    const offset = (i === 1) ? (DESC_OFFSET + googleExtraOffset) : DESC_OFFSET;
    el.style.left = (W / 2) + 'px';
    el.style.top = (H / 2 + offset) + 'px';
  });
}
buildAllTargets();

// Truly Uniform Cosmic Distribution across full canvas bleed space
function uniformCosmicCoord() {
  const spreadX = W * 1.3;
  const spreadY = H * 1.3;
  return {
    x: (Math.random() - 0.5) * spreadX,
    y: (Math.random() - 0.5) * spreadY,
    z: (Math.random() - 0.5) * 360,
    vx: (Math.random() - 0.5) * 0.26,
    vy: (Math.random() - 0.5) * 0.26
  };
}

// ─── UNIFIED PARTICLE SYSTEM BUFFER ──────────────────────────────────
const N_STARS = IS_MOBILE ? 1200 : 2200;
const N_RECRUITS = Math.round(N_STARS * 0.06); // Exactly 6% dynamic recruits
const TRAIL_LEN = 16;
const NUM_ROCKETS = 3; // 3 crossing rockets
const ROCKET_TRAIL_LEN = 12;

let HEAD_POOL = Math.max(...HEADLINE_TARGETS.map(t => t.points.length));
let DESC_POOL = Math.max(...DESC_TARGETS.map(t => t.points.length));
let TOTAL_PARTICLES = N_STARS + HEAD_POOL + DESC_POOL + TRAIL_LEN + (NUM_ROCKETS * ROCKET_TRAIL_LEN);

let posBuffer = new Float32Array(TOTAL_PARTICLES * 3);
let sizeBuffer = new Float32Array(TOTAL_PARTICLES);
let alphaBuffer = new Float32Array(TOTAL_PARTICLES);

const vboPosition = gl.createBuffer();
const vboSize = gl.createBuffer();
const vboAlpha = gl.createBuffer();

// Background Stars Physics
const sx = new Float32Array(N_STARS), sy = new Float32Array(N_STARS), sz = new Float32Array(N_STARS);
const svx = new Float32Array(N_STARS), svy = new Float32Array(N_STARS), svz = new Float32Array(N_STARS);
const sOpa = new Float32Array(N_STARS), sSize = new Float32Array(N_STARS), sSeed = new Float32Array(N_STARS), sSpeed = new Float32Array(N_STARS);

const starRecruitMap = new Int32Array(N_STARS).fill(-1);
for (let r = 0; r < N_RECRUITS; r++) {
  const sIdx = Math.floor(r * (N_STARS / N_RECRUITS));
  starRecruitMap[sIdx] = r;
}

function initStarPool() {
  for (let i = 0; i < N_STARS; i++) {
    const p = uniformCosmicCoord();
    sx[i] = p.x; sy[i] = p.y; sz[i] = p.z;
    svx[i] = p.vx; svy[i] = p.vy;
    svz[i] = (Math.random() - 0.5) * 0.14;
    sOpa[i] = 0.18 + Math.random() * 0.44;
    sSize[i] = 1.1 + Math.random() * 1.8;
    sSeed[i] = Math.random() * Math.PI * 2;
    sSpeed[i] = 0.4 + Math.random() * 0.6;
  }
}
initStarPool();

// Headline & Subtitle Particles Physics
const PUFF_HEAD = IS_MOBILE ? 24 : 34;
const PUFF_DESC = IS_MOBILE ? 14 : 20;

let hDriftX, hDriftY, hDriftZ, hVelX, hVelY, hPuffX, hPuffY;
let dDriftX, dDriftY, dVelX, dVelY, dPuffX, dPuffY;

function initTextPools() {
  HEAD_POOL = Math.max(...HEADLINE_TARGETS.map(t => t.points.length));
  DESC_POOL = Math.max(...DESC_TARGETS.map(t => t.points.length));
  TOTAL_PARTICLES = N_STARS + HEAD_POOL + DESC_POOL + TRAIL_LEN + (NUM_ROCKETS * ROCKET_TRAIL_LEN);

  posBuffer = new Float32Array(TOTAL_PARTICLES * 3);
  sizeBuffer = new Float32Array(TOTAL_PARTICLES);
  alphaBuffer = new Float32Array(TOTAL_PARTICLES);

  hDriftX = new Float32Array(HEAD_POOL); hDriftY = new Float32Array(HEAD_POOL); hDriftZ = new Float32Array(HEAD_POOL);
  hVelX = new Float32Array(HEAD_POOL); hVelY = new Float32Array(HEAD_POOL);
  hPuffX = new Float32Array(HEAD_POOL); hPuffY = new Float32Array(HEAD_POOL);

  for (let i = 0; i < HEAD_POOL; i++) {
    const p = uniformCosmicCoord();
    hDriftX[i] = p.x; hDriftY[i] = p.y; hDriftZ[i] = p.z;
    hVelX[i] = p.vx; hVelY[i] = p.vy;
    hPuffX[i] = (Math.random() - 0.5) * 2; hPuffY[i] = (Math.random() - 0.5) * 2;
  }

  dDriftX = new Float32Array(DESC_POOL); dDriftY = new Float32Array(DESC_POOL);
  dVelX = new Float32Array(DESC_POOL); dVelY = new Float32Array(DESC_POOL);
  dPuffX = new Float32Array(DESC_POOL); dPuffY = new Float32Array(DESC_POOL);

  for (let i = 0; i < DESC_POOL; i++) {
    const p = uniformCosmicCoord();
    dDriftX[i] = p.x; dDriftY[i] = p.y;
    dVelX[i] = p.vx; dVelY[i] = p.vy;
    dPuffX[i] = (Math.random() - 0.5) * 2; dPuffY[i] = (Math.random() - 0.5) * 2;
  }
}
initTextPools();

// ─── Celestial Phenomena (Shooting Star & 3 Avoidance Rockets) ───────
let shootingStar = null;
let nextStarTime = performance.now() + 20000;
let lastFrameTime = performance.now();

function spawnShootingStar() {
  const R = Math.max(W, H) * 0.75;
  const travelAngle = Math.random() * Math.PI * 2;
  const startAngle = travelAngle + Math.PI;
  const startR = R * (0.85 + Math.random() * 0.35);
  const perpAngle = travelAngle + Math.PI / 2;
  const perpOffset = (Math.random() - 0.5) * Math.min(W, H) * 0.5;
  const speed = 480 + Math.random() * 260;
  shootingStar = {
    x: Math.cos(startAngle) * startR + Math.cos(perpAngle) * perpOffset,
    y: Math.sin(startAngle) * startR + Math.sin(perpAngle) * perpOffset,
    vx: Math.cos(travelAngle) * speed,
    vy: Math.sin(travelAngle) * speed,
    trail: [],
    age: 0
  };
}

// 3 Rockets with Active Text Avoidance
const rockets = [];
for (let r = 0; r < NUM_ROCKETS; r++) {
  rockets.push({
    active: false,
    x: 0, y: 0, vx: 0, vy: 0, trail: [], age: 0,
    nextSpawn: performance.now() + 4000 + r * 11000
  });
}

function spawnRocketInstance() {
  const dir = Math.random() < 0.5 ? 1 : -1;
  const speed = 110 + Math.random() * 80;
  // Choose upper sky (Y > +145) or lower ground (Y < -180)
  const isUpper = Math.random() < 0.55;
  const y = isUpper 
    ? 150 + Math.random() * (H * 0.32) 
    : -180 - Math.random() * (H * 0.26);
  return {
    active: true,
    x: dir > 0 ? -W * 0.65 : W * 0.65,
    y: y,
    vx: speed * dir,
    vy: (Math.random() - 0.5) * 5,
    trail: [],
    age: 0
  };
}

// ─── Trackpad & Mouse Wheel Normalization ────────────────────────────
let targetScrollY = window.scrollY || 0;
let smoothedScrollY = window.scrollY || 0;

window.addEventListener('wheel', e => {
  e.preventDefault();
  let dy = e.deltaY;
  if (e.deltaMode === 1) {
    dy *= 32;
  } else if (e.deltaMode === 2) {
    dy *= window.innerHeight;
  }
  const maxScroll = Math.max(1, document.documentElement.scrollHeight - window.innerHeight);
  targetScrollY = clamp(targetScrollY + dy, 0, maxScroll);
}, { passive: false });

window.addEventListener('scroll', () => {
  if (Math.abs(window.scrollY - smoothedScrollY) > 80) {
    targetScrollY = window.scrollY;
  }
}, { passive: true });

// Mobile Touch Drag Scrubbing
let touchStartY = 0;
window.addEventListener('touchstart', e => {
  if (e.touches && e.touches[0]) touchStartY = e.touches[0].clientY;
}, { passive: true });

window.addEventListener('touchmove', e => {
  if (e.touches && e.touches[0]) {
    const deltaY = touchStartY - e.touches[0].clientY;
    touchStartY = e.touches[0].clientY;
    const maxScroll = Math.max(1, document.documentElement.scrollHeight - window.innerHeight);
    targetScrollY = clamp(targetScrollY + deltaY * 1.35, 0, maxScroll);
  }
}, { passive: true });

// URL parameters for previewing / automated testing
const urlParams = new URLSearchParams(window.location.search);
function checkUrlParams() {
  const maxScroll = Math.max(1, document.documentElement.scrollHeight - window.innerHeight);
  if (urlParams.has('contact')) {
    targetScrollY = maxScroll;
    smoothedScrollY = targetScrollY;
  } else if (urlParams.has('p')) {
    const normP = parseFloat(urlParams.get('p'));
    targetScrollY = normP * maxScroll;
    smoothedScrollY = targetScrollY;
  } else if (urlParams.has('scroll')) {
    targetScrollY = parseFloat(urlParams.get('scroll'));
    smoothedScrollY = targetScrollY;
  }
}
if (document.readyState === 'complete') checkUrlParams();
else window.addEventListener('load', checkUrlParams);

// ─── EXACT SEQUENTIAL SCROLL TIMELINE (STATES 1 TO 12) ───────────────
function getGlobalTimeline(p) {
  let fromIdx = 0, toIdx = 0, interpT = 0, morphProgress = 0;
  let activeDescIdx = 0, descOpacity = 0, disperseF = 0;

  if (p < 0.030) {
    // State 1 (Initial Load): Page opens with title "Plato Bougas" fully formed, subtitle dormant
    fromIdx = 0; toIdx = 0; interpT = 0; morphProgress = 0;
    activeDescIdx = 0; descOpacity = 0; disperseF = 0;
  } else if (p < 0.090) {
    // State 2 (Scroll): Subtitle "Analyst · Founder · Builder" forms and holds
    fromIdx = 0; toIdx = 0; interpT = 0; morphProgress = 0;
    activeDescIdx = 0;
    descOpacity = smoothstep(0.030, 0.065, p);
    disperseF = 0;
  } else if (p < 0.140) {
    // State 3 (Scroll): Subtitle disperses back into the cosmos
    fromIdx = 0; toIdx = 0; interpT = 0; morphProgress = 0;
    activeDescIdx = 0;
    descOpacity = 1 - smoothstep(0.090, 0.135, p);
    disperseF = 0;
  } else if (p < 0.270) {
    // State 4 (Scroll): Main title morphs into "Google"
    const t = smoothstep(0.140, 0.255, p);
    fromIdx = 0; toIdx = 1; interpT = t;
    morphProgress = t;
    activeDescIdx = 0; descOpacity = 0; disperseF = 0;
  } else if (p < 0.370) {
    // State 5 (Scroll): "Google" holds, Google subtitle forms and holds (with extra descender clearance)
    fromIdx = 1; toIdx = 1; interpT = 0; morphProgress = 0;
    activeDescIdx = 1;
    descOpacity = smoothstep(0.270, 0.325, p);
    disperseF = 0;
  } else if (p < 0.430) {
    // State 6 (Scroll): Google subtitle disperses back into background
    fromIdx = 1; toIdx = 1; interpT = 0; morphProgress = 0;
    activeDescIdx = 1;
    descOpacity = 1 - smoothstep(0.370, 0.425, p);
    disperseF = 0;
  } else if (p < 0.560) {
    // State 7 (Scroll): Main title morphs into "Goldman Sachs"
    const t = smoothstep(0.430, 0.545, p);
    fromIdx = 1; toIdx = 2; interpT = t;
    morphProgress = t;
    activeDescIdx = 1; descOpacity = 0; disperseF = 0;
  } else if (p < 0.650) {
    // State 8 (Scroll): "Goldman Sachs" holds, Goldman Sachs subtitle forms and holds
    fromIdx = 2; toIdx = 2; interpT = 0; morphProgress = 0;
    activeDescIdx = 2;
    descOpacity = smoothstep(0.560, 0.615, p);
    disperseF = 0;
  } else if (p < 0.700) {
    // State 8b: Goldman Sachs subtitle disperses
    fromIdx = 2; toIdx = 2; interpT = 0; morphProgress = 0;
    activeDescIdx = 2;
    descOpacity = 1 - smoothstep(0.650, 0.695, p);
    disperseF = 0;
  } else if (p < 0.790) {
    // State 9 (Scroll): Main title morphs into "University of Southern California"
    const t = smoothstep(0.700, 0.775, p);
    fromIdx = 2; toIdx = 3; interpT = t;
    morphProgress = t;
    activeDescIdx = 2; descOpacity = 0; disperseF = 0;
  } else if (p < 0.835) {
    // State 10 (Scroll): "USC" holds, USC subtitle forms and holds
    fromIdx = 3; toIdx = 3; interpT = 0; morphProgress = 0;
    activeDescIdx = 3;
    descOpacity = smoothstep(0.790, 0.820, p);
    disperseF = 0;
  } else if (p < 0.875) {
    // State 11 (Scroll): USC subtitle AND title FULLY DISPERSE into cosmic drift
    fromIdx = 3; toIdx = 3; interpT = 0; morphProgress = 0;
    activeDescIdx = 3;
    descOpacity = 1 - smoothstep(0.835, 0.860, p); // Subtitle completely gone by 0.860
    disperseF = smoothstep(0.835, 0.870, p);       // Title particles completely dispersed by 0.870
  } else {
    // State 12: USC is 100% dispersed; contact links now scroll up from bottom
    fromIdx = 3; toIdx = 3; interpT = 0; morphProgress = 0;
    activeDescIdx = 3;
    descOpacity = 0;
    disperseF = 1.0;
  }

  return {
    fromIdx,
    toIdx,
    interpT,
    morphProgress,
    activeDescIdx,
    descOpacity,
    disperseF
  };
}

const hint = document.getElementById('hint');
const scrubBar = document.getElementById('scrub-bar');
const overlays = [0, 1, 2, 3].map(i => document.getElementById('ov' + i));

// ─── MAIN ANIMATION & WEBGL RENDER LOOP ──────────────────────────────
let time = 0;

function frame() {
  requestAnimationFrame(frame);
  time += 0.006;

  // DAMPING LERP: Smooths the scroll position with continuous inertial decay
  const scrollDamping = IS_MOBILE ? 0.12 : 0.09;
  smoothedScrollY += (targetScrollY - smoothedScrollY) * scrollDamping;

  // Synchronize native window scroll position
  window.scrollTo(0, Math.round(smoothedScrollY));

  const maxScroll = Math.max(1, document.documentElement.scrollHeight - window.innerHeight);
  const normProgress = clamp(smoothedScrollY / maxScroll, 0, 1);
  if (scrubBar) scrubBar.style.height = (normProgress * 100) + '%';
  hint.style.opacity = smoothedScrollY > 40 ? '0' : '0.35';

  // Calculate timeline state strictly from normalized progress
  const state = getGlobalTimeline(normProgress);

  // Camera 3D subtle breathing rotation
  const headRotY = Math.sin(time * 0.16) * 0.14;
  const headRotX = Math.sin(time * 0.11) * 0.03;

  const projMatrix = mat4Ortho(-W / 2, W / 2, -H / 2, H / 2, 0.1, 3000);
  const mvMatrix = mat4LookAt(headRotX, headRotY, 0, 0, 600);

  // ─── 1. SIMULATE BACKGROUND STARS ────────────────────────────────────
  const A = HEADLINE_TARGETS[state.fromIdx];
  const B = HEADLINE_TARGETS[state.toIdx];
  const aLen = A ? A.points.length : 0;
  const bLen = B ? B.points.length : 0;

  for (let i = 0; i < N_STARS; i++) {
    const rp = repel(sx[i], sy[i]);
    sx[i] += svx[i] + rp.x;
    sy[i] += svy[i] + rp.y;
    sz[i] += svz[i];

    const boundX = W * 0.65;
    const boundY = H * 0.65;
    if (sx[i] > boundX) sx[i] = -boundX;
    if (sx[i] < -boundX) sx[i] = boundX;
    if (sy[i] > boundY) sy[i] = -boundY;
    if (sy[i] < -boundY) sy[i] = boundY;
    if (sz[i] > 260) sz[i] = -260;
    if (sz[i] < -260) sz[i] = 260;

    const wobX = Math.sin(time * sSpeed[i] + sSeed[i]) * 8;
    const wobY = Math.cos(time * sSpeed[i] * 0.8 + sSeed[i]) * 8;
    const tw = 0.5 + 0.5 * Math.sin(time * 1.3 + sSeed[i]);

    let px = sx[i] + wobX;
    let py = sy[i] + wobY;
    let pz = sz[i];
    let pAlpha = sOpa[i] * tw;
    let pSize = sSize[i];

    const ix = i * 3;
    posBuffer[ix] = px;
    posBuffer[ix + 1] = py;
    posBuffer[ix + 2] = pz;
    sizeBuffer[i] = pSize;
    alphaBuffer[i] = pAlpha;
  }

  // ─── 2. SIMULATE HEADLINE TEXT PARTICLES ───────────────────────────
  const headOffset = N_STARS;

  for (let i = 0; i < HEAD_POOL; i++) {
    const bufIdx = headOffset + i;
    const ix = bufIdx * 3;

    const hasA = i < aLen;
    const hasB = i < bLen;

    const rp = repel(hDriftX[i], hDriftY[i]);
    hDriftX[i] += hVelX[i] + rp.x * 0.6;
    hDriftY[i] += hVelY[i] + rp.y * 0.6;
    if (hDriftX[i] > W * 0.85) hDriftX[i] = -W * 0.85;
    if (hDriftX[i] < -W * 0.85) hDriftX[i] = W * 0.85;
    if (hDriftY[i] > H * 0.85) hDriftY[i] = -H * 0.85;
    if (hDriftY[i] < -H * 0.85) hDriftY[i] = H * 0.85;

    if (state.disperseF > 0) {
      const lastTgt = HEADLINE_TARGETS[3];
      if (lastTgt && i < lastTgt.points.length) {
        const tb = lastTgt.points[i];
        posBuffer[ix]     = lerp(tb.x, hDriftX[i], state.disperseF);
        posBuffer[ix + 1] = lerp(tb.y, hDriftY[i], state.disperseF);
        posBuffer[ix + 2] = lerp(0, hDriftZ[i], state.disperseF);
        alphaBuffer[bufIdx] = (1.0 - state.disperseF) * 0.92;
        sizeBuffer[bufIdx]  = lerp(lastTgt.dotSize, 1.2, state.disperseF);
      } else {
        alphaBuffer[bufIdx] = 0;
        sizeBuffer[bufIdx] = 0;
      }
    } else if (state.fromIdx === state.toIdx) {
      // Discrete Plateau State (Title holds completely motionless)
      if (hasA) {
        const ta = A.points[i];
        posBuffer[ix]     = ta.x;
        posBuffer[ix + 1] = ta.y;
        posBuffer[ix + 2] = 0;
        alphaBuffer[bufIdx] = 0.92;
        sizeBuffer[bufIdx]  = A.dotSize;
      } else {
        posBuffer[ix] = 0; posBuffer[ix + 1] = 0; posBuffer[ix + 2] = -9999;
        alphaBuffer[bufIdx] = 0;
        sizeBuffer[bufIdx]  = 0;
      }
    } else if (hasA && hasB) {
      // Discrete Morph State: Direct smooth draw-in to target title
      const ta = A.points[i], tb = B.points[i];
      posBuffer[ix]     = lerp(ta.x, tb.x, state.interpT);
      posBuffer[ix + 1] = lerp(ta.y, tb.y, state.interpT);
      posBuffer[ix + 2] = 0;
      alphaBuffer[bufIdx] = 0.92;
      sizeBuffer[bufIdx]  = lerp(A.dotSize, B.dotSize, state.interpT);
    } else if (hasB) {
      // Particles draw in smoothly from drift to form the target title
      const tb = B.points[i];
      posBuffer[ix]     = lerp(hDriftX[i], tb.x, state.interpT);
      posBuffer[ix + 1] = lerp(hDriftY[i], tb.y, state.interpT);
      posBuffer[ix + 2] = lerp(hDriftZ[i], 0, state.interpT);
      alphaBuffer[bufIdx] = lerp(0, 0.92, state.interpT);
      sizeBuffer[bufIdx]  = B.dotSize;
    } else if (hasA) {
      // Surplus particles fade out smoothly into background drift
      const ta = A.points[i];
      posBuffer[ix]     = lerp(ta.x, hDriftX[i], state.interpT);
      posBuffer[ix + 1] = lerp(ta.y, hDriftY[i], state.interpT);
      posBuffer[ix + 2] = lerp(0, hDriftZ[i], state.interpT);
      alphaBuffer[bufIdx] = lerp(0.92, 0, state.interpT);
      sizeBuffer[bufIdx]  = A.dotSize;
    } else {
      posBuffer[ix] = 0; posBuffer[ix + 1] = 0; posBuffer[ix + 2] = -9999;
      alphaBuffer[bufIdx] = 0;
      sizeBuffer[bufIdx]  = 0;
    }
  }

  // ─── 3. SIMULATE SUBTITLE DESCRIPTION PARTICLES ────────────────────
  const descTgt = DESC_TARGETS[state.activeDescIdx];
  const dLen = descTgt ? descTgt.points.length : 0;
  const dDot = descTgt ? descTgt.dotSize : 1.4;

  const descEffectiveOpacity = state.descOpacity * (1 - state.disperseF);
  const descOffset = N_STARS + HEAD_POOL;

  const overlayOpacity = smoothstep(0.70, 0.95, descEffectiveOpacity) * (1 - state.disperseF);
  const particleFade = 1 - overlayOpacity;

  for (let i = 0; i < DESC_POOL; i++) {
    const bufIdx = descOffset + i;
    const ix = bufIdx * 3;

    dDriftX[i] += dVelX[i];
    dDriftY[i] += dVelY[i];
    if (dDriftX[i] > W * 0.7) dDriftX[i] = -W * 0.7;
    if (dDriftX[i] < -W * 0.7) dDriftX[i] = W * 0.7;
    if (dDriftY[i] > H * 0.7) dDriftY[i] = -H * 0.7;
    if (dDriftY[i] < -H * 0.7) dDriftY[i] = H * 0.7;

    if (descTgt && i < dLen && descEffectiveOpacity > 0.005) {
      const t = descTgt.points[i];
      const settle = smoothstep(0.15, 0.95, descEffectiveOpacity);
      const puffDisplace = (1 - settle) * PUFF_DESC * Math.sin(descEffectiveOpacity * Math.PI);

      posBuffer[ix]     = lerp(dDriftX[i], t.x, settle) + dPuffX[i] * puffDisplace;
      posBuffer[ix + 1] = lerp(dDriftY[i], t.y, settle) + dPuffY[i] * puffDisplace;
      posBuffer[ix + 2] = 0;
      alphaBuffer[bufIdx] = smoothstep(0.04, 0.45, descEffectiveOpacity) * 0.94 * particleFade;
      sizeBuffer[bufIdx]  = dDot;
    } else {
      posBuffer[ix] = 0; posBuffer[ix + 1] = 0; posBuffer[ix + 2] = -9999;
      alphaBuffer[bufIdx] = 0;
      sizeBuffer[bufIdx]  = 0;
    }
  }

  // Synchronize HTML overlay subtitles
  for (let i = 0; i < 4; i++) {
    overlays[i].style.opacity = (i === state.activeDescIdx) ? overlayOpacity.toFixed(3) : '0';
  }

  // ─── 4. CELESTIAL PHENOMENA (SHOOTING STAR & 3 AVOIDANCE ROCKETS) ──
  const nowMs = performance.now();
  const dt = Math.min((nowMs - lastFrameTime) / 1000, 0.05);
  lastFrameTime = nowMs;

  // Shooting Star
  if (!shootingStar && nowMs >= nextStarTime) {
    spawnShootingStar();
    nextStarTime = nowMs + 20000 + Math.random() * 18000;
  }
  if (shootingStar) {
    shootingStar.x += shootingStar.vx * dt;
    shootingStar.y += shootingStar.vy * dt;
    shootingStar.age += dt;
    shootingStar.trail.unshift({ x: shootingStar.x, y: shootingStar.y });
    if (shootingStar.trail.length > TRAIL_LEN) shootingStar.trail.length = TRAIL_LEN;
    const dist = Math.hypot(shootingStar.x, shootingStar.y);
    if (dist > Math.max(W, H) * 1.25 || shootingStar.age > 6) shootingStar = null;
  }

  const starTrailOffset = descOffset + DESC_POOL;
  for (let i = 0; i < TRAIL_LEN; i++) {
    const bufIdx = starTrailOffset + i;
    const ix = bufIdx * 3;
    if (shootingStar && i < shootingStar.trail.length) {
      const pt = shootingStar.trail[i];
      const fade = 1 - i / TRAIL_LEN;
      posBuffer[ix] = pt.x;
      posBuffer[ix + 1] = pt.y;
      posBuffer[ix + 2] = 0;
      alphaBuffer[bufIdx] = fade * fade * 0.88;
      sizeBuffer[bufIdx] = 2.6 * fade + 0.6;
    } else {
      posBuffer[ix] = 0; posBuffer[ix + 1] = 0; posBuffer[ix + 2] = -9999;
      alphaBuffer[bufIdx] = 0;
      sizeBuffer[bufIdx] = 0;
    }
  }

  // 3 Rockets with Text Bounding-Box Avoidance Logic
  const textBoxMinX = -W * 0.42;
  const textBoxMaxX = W * 0.42;
  const textBoxMinY = -170; // Extended lower bound covers Google subtitle descender clearance
  const textBoxMaxY = 115;

  const rocketsOffset = starTrailOffset + TRAIL_LEN;
  rockets.forEach((rk, rIdx) => {
    if (!rk.active && nowMs >= rk.nextSpawn) {
      rockets[rIdx] = spawnRocketInstance();
    }
    if (rk.active) {
      rk.x += rk.vx * dt;
      rk.y += rk.vy * dt;
      rk.age += dt;

      // Avoidance steering: curve away from the text bounding box
      if (rk.x > textBoxMinX - 70 && rk.x < textBoxMaxX + 70) {
        if (rk.y > -20 && rk.y < textBoxMaxY + 30) {
          rk.y += 50 * dt; // Steer upward into safe sky
        } else if (rk.y <= -20 && rk.y > textBoxMinY - 30) {
          rk.y -= 50 * dt; // Steer downward into safe ground
        }
      }

      rk.trail.unshift({ x: rk.x, y: rk.y });
      if (rk.trail.length > ROCKET_TRAIL_LEN) rk.trail.length = ROCKET_TRAIL_LEN;
      if (Math.abs(rk.x) > W * 0.75 || rk.age > 16) {
        rk.active = false;
        rk.nextSpawn = nowMs + 12000 + Math.random() * 20000;
      }
    }

    const baseIdx = rocketsOffset + (rIdx * ROCKET_TRAIL_LEN);
    for (let i = 0; i < ROCKET_TRAIL_LEN; i++) {
      const bufIdx = baseIdx + i;
      const ix = bufIdx * 3;
      if (rk.active && i < rk.trail.length) {
        const pt = rk.trail[i];
        const fade = 1 - i / ROCKET_TRAIL_LEN;
        posBuffer[ix] = pt.x;
        posBuffer[ix + 1] = pt.y;
        posBuffer[ix + 2] = 0;
        alphaBuffer[bufIdx] = fade * fade * 0.55;
        sizeBuffer[bufIdx] = 1.6 * fade + 0.4;
      } else {
        posBuffer[ix] = 0; posBuffer[ix + 1] = 0; posBuffer[ix + 2] = -9999;
        alphaBuffer[bufIdx] = 0;
        sizeBuffer[bufIdx] = 0;
      }
    }
  });

  // ─── 5. UPLOAD TO UNIFIED HARDWARE BUFFER & SINGLE DRAW CALL ────────
  gl.clearColor(0.0, 0.0, 0.0, 1.0);
  gl.clear(gl.COLOR_BUFFER_BIT);

  gl.enable(gl.BLEND);
  gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);

  gl.useProgram(program);
  gl.uniformMatrix4fv(uProjLoc, false, projMatrix);
  gl.uniformMatrix4fv(uMvLoc, false, mvMatrix);
  gl.uniform1f(uDPRLoc, DPR);

  gl.bindBuffer(gl.ARRAY_BUFFER, vboPosition);
  gl.bufferData(gl.ARRAY_BUFFER, posBuffer, gl.DYNAMIC_DRAW);
  gl.enableVertexAttribArray(aPosLoc);
  gl.vertexAttribPointer(aPosLoc, 3, gl.FLOAT, false, 0, 0);

  gl.bindBuffer(gl.ARRAY_BUFFER, vboSize);
  gl.bufferData(gl.ARRAY_BUFFER, sizeBuffer, gl.DYNAMIC_DRAW);
  gl.enableVertexAttribArray(aSizeLoc);
  gl.vertexAttribPointer(aSizeLoc, 1, gl.FLOAT, false, 0, 0);

  gl.bindBuffer(gl.ARRAY_BUFFER, vboAlpha);
  gl.bufferData(gl.ARRAY_BUFFER, alphaBuffer, gl.DYNAMIC_DRAW);
  gl.enableVertexAttribArray(aAlphaLoc);
  gl.vertexAttribPointer(aAlphaLoc, 1, gl.FLOAT, false, 0, 0);

  gl.drawArrays(gl.POINTS, 0, TOTAL_PARTICLES);
}

// ─── Viewport Resize Handling (iPhone & Desktop) ─────────────────────
let lastW = W, lastH = H;
function onResize() {
  const vp = getViewportSize();
  if (IS_MOBILE && vp.w === lastW && vp.h === lastH) return;
  lastW = vp.w; lastH = vp.h;

  W = vp.w; H = vp.h;
  DPR = Math.min(window.devicePixelRatio || 1, IS_MOBILE ? 1.5 : 2.0);
  updateCanvasDimensions();
  buildAllTargets();
  initTextPools();
  initStarPool();
}

window.addEventListener('resize', onResize, { passive: true });
if (window.visualViewport) {
  window.visualViewport.addEventListener('resize', onResize, { passive: true });
}

document.fonts.ready.then(() => {
  buildAllTargets();
  initTextPools();
  initStarPool();
  frame();
});
</script>
</body>
