<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Plato Bougas</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #050508;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow-x: hidden;
      overscroll-behavior: none;
      -webkit-tap-highlight-color: transparent;
    }

    #canvas-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-height: 1;
      pointer-events: none;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .scroll-space {
      position: relative;
      height: 450vh; /* Smooth target height */
      width: 100%;
      pointer-events: auto;
      touch-action: pan-y;
    }

    .links-layer {
      position: fixed;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      display: flex;
      gap: 20px;
      opacity: 0;
      transition: opacity 0.4s ease;
      pointer-events: none;
    }

    .links-layer.visible {
      opacity: 1;
      pointer-events: auto;
    }

    .links-layer a {
      color: #8888aa;
      text-decoration: none;
      font-size: 14px;
      letter-spacing: 1px;
      text-transform: uppercase;
      transition: color 0.2s ease;
    }

    .links-layer a:hover {
      color: #ffffff;
    }
  </style>
</head>
<body>

  <div id="canvas-container">
    <canvas id="stage"></canvas>
  </div>

  <div class="scroll-space"></div>

  <div class="links-layer" id="social-links">
    <a href="mailto:hello@platobougas.com">Email</a>
    <a href="https://linkedin.com" target="_blank" rel="noopener">LinkedIn</a>
    <a href="https://github.com" target="_blank" rel="noopener">GitHub</a>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    // --- Setup Canvas & Engine ---
    const canvas = document.getElementById('stage');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    
    // Lock dimensions on load to prevent Chrome URL bar jump glitches
    let width = window.innerWidth;
    let height = window.innerHeight;
    renderer.setSize(width, height);

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);
    camera.position.z = 500;

    // --- Configuration Constants ---
    const IS_MOBILE = width < 768;
    // Tightened offset bringing subtitles closer without touching descenders ('g', 'p', etc.)
    const DESC_OFFSET = IS_MOBILE ? 68 : 75; 
    const PARTICLE_SIZE = IS_MOBILE ? 1.8 : 2.2;

    // --- Text Data Groups ---
    const SECTIONS = [
      {
        title: "Plato Bougas",
        subtitle: ["Analyst • Founder • Builder"]
      },
      {
        title: "Google",
        subtitle: ["Hardware Finance & Strategy"]
      },
      {
        title: "USC",
        subtitle: IS_MOBILE ? ["University of", "Southern California"] : ["University of Southern California"]
      },
      {
        title: "hello@platobougas.com",
        subtitle: ["Let's build something together."]
      }
    ];

    // --- Glyph Sampling Engine ---
    function sampleTextPoints(text, fontSize, isBold = false) {
      const textCanvas = document.createElement('canvas');
      const ctx = textCanvas.getContext('2d');
      const scale = 2; // High resolution sampling
      
      ctx.font = `${isBold ? '700' : '400'} ${fontSize * scale}px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif`;
      const metrics = ctx.measureText(text);
      
      textCanvas.width = Math.ceil(metrics.width) + 20;
      textCanvas.height = Math.ceil(fontSize * 1.5 * scale);
      
      ctx.font = `${isBold ? '700' : '400'} ${fontSize * scale}px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif`;
      ctx.fillStyle = '#ffffff';
      ctx.textBaseline = 'middle';
      ctx.fillText(text, 10, textCanvas.height / 2);

      const imgData = ctx.getImageData(0, 0, textCanvas.width, textCanvas.height);
      const points = [];
      const step = IS_MOBILE ? 3 : 2; // Density control

      for (let y = 0; y < textCanvas.height; y += step) {
        for (let x = 0; x < textCanvas.width; x += step) {
          const alpha = imgData.data[(y * textCanvas.width + x) * 4 + 3];
          if (alpha > 128) {
            points.push({
              x: (x - textCanvas.width / 2) / scale,
              y: -(y - textCanvas.height / 2) / scale
            });
          }
        }
      }
      return points;
    }

    // --- Particle System Assembly ---
    const allParticles = [];
    const geometry = new THREE.BufferGeometry();
    
    // Generate particles for each section
    SECTIONS.forEach((sec, sectionIndex) => {
      const titleFontSize = IS_MOBILE ? (sec.title.length > 15 ? 26 : 38) : 54;
      const subFontSize = IS_MOBILE ? 14 : 18;

      // 1. Title Points
      const titlePoints = sampleTextPoints(sec.title, titleFontSize, true);
      titlePoints.forEach(p => {
        allParticles.push({
          sec: sectionIndex,
          type: 'title',
          baseX: p.x,
          baseY: p.y,
          x: p.x,
          y: p.y + (sectionIndex * -350), // Section vertical offset
          z: 0,
          vx: (Math.random() - 0.5) * 1.5,
          vy: (Math.random() - 0.5) * 1.5,
          vz: (Math.random() - 0.5) * 1.5
        });
      });

      // 2. Subtitle Points
      sec.subtitle.forEach((subLine, lineIdx) => {
        const subPoints = sampleTextPoints(subLine, subFontSize, false);
        const lineYOffset = -DESC_OFFSET - (lineIdx * (subFontSize + 8));

        subPoints.forEach(p => {
          allParticles.push({
            sec: sectionIndex,
            type: 'subtitle',
            baseX: p.x,
            baseY: p.y + lineYOffset,
            x: p.x,
            y: p.y + lineYOffset + (sectionIndex * -350),
            z: 0,
            vx: (Math.random() - 0.5) * 2.5,
            vy: (Math.random() - 0.5) * 2.5,
            vz: (Math.random() - 0.5) * 2.5
          });
        });
      });
    });

    const count = allParticles.length;
    const positions = new Float32Array(count * 3);
    const initialPositions = new Float32Array(count * 3);

    allParticles.forEach((p, i) => {
      positions[i * 3] = p.x;
      positions[i * 3 + 1] = p.y;
      positions[i * 3 + 2] = p.z;

      initialPositions[i * 3] = p.x;
      initialPositions[i * 3 + 1] = p.y;
      initialPositions[i * 3 + 2] = p.z;
    });

    geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

    // Particle Material
    const material = new THREE.PointsMaterial({
      color: 0xffffff,
      size: PARTICLE_SIZE,
      transparent: true,
      opacity: 0.9,
      blending: THREE.AdditiveBlending
    });

    const particleSystem = new THREE.Points(geometry, material);
    scene.add(particleSystem);

    // --- Scroll Lock & Animation Engine ---
    let targetScrollY = 0;
    let currentScrollY = 0;
    const maxScroll = document.documentElement.scrollHeight - window.innerHeight;

    window.addEventListener('scroll', () => {
      // Clamp scroll to prevent elastic overscroll bounce glitches
      targetScrollY = Math.max(0, Math.min(window.scrollY, maxScroll));
    }, { passive: true });

    const socialLinks = document.getElementById('social-links');

    function animate() {
      requestAnimationFrame(animate);

      // Smooth interpolation (dampened lerp)
      currentScrollY += (targetScrollY - currentScrollY) * 0.08;

      // Scroll Progress Normalized
      const totalHeight = document.documentElement.scrollHeight - window.innerHeight;
      const progress = Math.max(0, Math.min(1, currentScrollY / (totalHeight || 1)));

      // Move camera smoothly down the timeline
      camera.position.y = -progress * 1050;

      const posAttr = geometry.attributes.position;
      const posArr = posAttr.array;

      // Calculate section thresholds
      const currentSectionFloat = progress * (SECTIONS.length - 1);
      const activeSecIdx = Math.floor(currentSectionFloat);
      const secProgress = currentSectionFloat - activeSecIdx;

      for (let i = 0; i < count; i++) {
        const p = allParticles[i];
        const i3 = i * 3;

        let targetX = initialPositions[i3];
        let targetY = initialPositions[i3 + 1];
        let targetZ = initialPositions[i3 + 2];

        // --- Smoother Dispersion Curve ---
        // Subtitles start dispersing earlier, but move slowly and smoothly without snapping
        if (p.sec === activeSecIdx) {
          if (p.type === 'subtitle') {
            // Smooth exponential curve (starts earlier, disperses gradually)
            const disperseFactor = Math.pow(Math.max(0, secProgress), 1.8) * 120;
            targetX += p.vx * disperseFactor;
            targetY += p.vy * disperseFactor;
            targetZ += p.vz * disperseFactor;
          }
        } else if (p.sec < activeSecIdx) {
          // Fully dispersed past sections
          const disperseFactor = 140;
          targetX += p.vx * disperseFactor;
          targetY += p.vy * disperseFactor;
          targetZ += p.vz * disperseFactor;
        }

        // Apply smooth particle positioning
        posArr[i3] += (targetX - posArr[i3]) * 0.1;
        posArr[i3 + 1] += (targetY - posArr[i3 + 1]) * 0.1;
        posArr[i3 + 2] += (targetZ - posArr[i3 + 2]) * 0.1;
      }

      posAttr.needsUpdate = true;

      // Toggle Social Links cleanly at the bottom
      if (progress > 0.88) {
        socialLinks.classList.add('visible');
      } else {
        socialLinks.classList.remove('visible');
      }

      renderer.render(scene, camera);
    }

    animate();

    // Resize Handler (Debounced to avoid address bar toggles)
    let resizeTimeout;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimeout);
      resizeTimeout = setTimeout(() => {
        if (Math.abs(window.innerWidth - width) > 50) { // Only trigger on actual width changes (orientation/desktop resize)
          width = window.innerWidth;
          height = window.innerHeight;
          camera.aspect = width / height;
          camera.updateProjectionMatrix();
          renderer.setSize(width, height);
        }
      }, 250);
    });
  </script>
</body>
</html>
